<body>

<div class="envelope">

  <header class="topo">
    <button class="icone" id="btn-ajuda" title="Como jogar" aria-label="Como jogar">?</button>
    <div class="marca">
      <a class="logo-impulso topo-logo" href="https://impulsofilmes.com.br" target="_blank" rel="noopener" aria-label="Impulso Filmes">
        <img alt="Impulso Filmes">
        <span class="logo-texto" aria-hidden="true"><b>IMPULSO</b><i>FILMES</i></span>
      </a>
      <b>EM CARTAZ</b>
      <span class="assinatura">um joguinho pra cinéfilo</span>
    </div>
    <div class="grupo-icones">
      <button class="icone" id="btn-cinemateca" title="Cinemateca (dias anteriores)" aria-label="Cinemateca">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>
        </svg>
      </button>
      <button class="icone" id="btn-numeros" title="Seus números" aria-label="Seus números">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M5 20V10M12 20V4M19 20v-7"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="regua"></div>

  <main id="app">
    <div class="faixa oculto" id="faixa-arquivo"></div>
    <section id="tela-sessoes"></section>
    <section id="tela-jogo" class="oculto"></section>
    <section id="tela-revelacao" class="oculto"></section>
    <section id="tela-fim" class="oculto"></section>
    <section id="tela-cinemateca" class="oculto"></section>
  </main>

  <p class="rodape" id="rodape"></p>
</div>

<div id="modal-raiz"></div>

<script src="config.js"></script>
<script src="dados/filmes.js"></script>
<script src="dados/piadas.js"></script>
<script src="js/util.js"></script>
<script src="js/metricas.js"></script>
<script src="js/calendario.js"></script>
<script src="js/imagens.js"></script>
<script src="js/jogo.js"></script>
</body>
